<script>
/* =====================================================
   データ構造
   ルビ記法： {漢字|かんじ}   下線：<u>…</u>
   PARTS ＝ 大きな区分（文字・語彙／文法／読解…）。後から追加できます。
   各セクション type:
     "choice" … 4択（選択肢が文字列）
     "usage"  … 問題6（語＋4つの文）
   ===================================================== */

var PARTS = [];

/* ---------- 言語知識（文字・語彙） ---------- */
PARTS.push({
  id: "p-moji",
  title: "言語知識（文字・語彙）",
  sections: [

  /* ===== 問題1 ===== */
  { id: "s1", nav: "問題1 漢字読み", title: "問題1｜漢字読み", type: "choice",
    inst: "＿＿＿の{言葉|ことば}の{読|よ}み{方|かた}として{最|もっと}もよいものを、1・2・3・4から{一|ひと}つ{選|えら}びなさい。",
    instTr: "Pilih satu jawaban yang paling tepat untuk cara membaca kata yang bergaris bawah, dari pilihan 1・2・3・4.",
    items: [
      { n: 1, q: "{社長|しゃちょう}が{記者|きしゃ}の{質問|しつもん}に<u>{応|おう}じる</u>。",
        tr: "Direktur menanggapi pertanyaan wartawan.",
        ch: ["とうじる","こうじる","おうじる","そうじる"], a: 3,
        exs: ["とうじる　×　（kata ini tidak ada）","こうじる　×　講じる（こうじる）＝menempuh/mengambil（langkah）例）対策（たいさく）を講じる＝mengambil langkah penanggulangan","おうじる　○　応じる（おうじる）＝menanggapi/menjawab","そうじる　×　（kata ini tidak ada）"] },
      { n: 2, q: "{料理|りょうり}を<u>{追加|ついか}</u>で{注文|ちゅうもん}する。",
        tr: "Memesan hidangan sebagai tambahan.",
        ch: ["ついが","ついか","づいか","づいが"], a: 2,
        exs: ["ついが　×　（kata ini tidak ada）","ついか　○　追加（ついか）＝tambahan","づいか　×　（kata ini tidak ada）","づいが　×　（kata ini tidak ada）"] },
      { n: 3, q: "{運転|うんてん}{免許|めんきょ}を<u>{取得|しゅとく}</u>した。",
        tr: "Saya memperoleh SIM (surat izin mengemudi).",
        ch: ["しゅうとう","しゅうとく","しゅとう","しゅとく"], a: 4,
        exs: ["しゅうとう　×　周到（しゅうとう）＝cermat/teliti 例）用意周到（よういしゅうとう）＝persiapan yang matang","しゅうとく　×　習得（しゅうとく）＝menguasai（keterampilan）例）技術（ぎじゅつ）を習得する＝menguasai teknik","しゅとう　×　（kata ini tidak ada）","しゅとく　○　取得（しゅとく）＝memperoleh/mendapatkan"] },
      { n: 4, q: "{今日|きょう}の{空|そら}は、<u>{鮮|あざ}やか</u>な{青色|あおいろ}だ。",

        ch: ["あざやか","さわやか","しなやか","おだやか"], a: 1,
        exs: ["あざやか　○　鮮やか（あざやか）＝cerah/mencolok","さわやか　×　爽やか（さわやか）＝segar/menyenangkan 例）爽やかな朝（あさ）＝pagi yang segar","しなやか　×　しなやか＝lentur/luwes 例）しなやかな体（からだ）＝tubuh yang lentur","おだやか　×　穏やか（おだやか）＝tenang/damai 例）穏やかな海（うみ）＝laut yang tenang"] },
      { n: 5, q: "{一|ひと}つのテーマについて<u>{討論|とうろん}</u>する。",
        tr: "Berdiskusi tentang satu tema.",
        ch: ["とろん","とうろん","ていろん","てろん"], a: 2,
        exs: ["とろん　×　（kata ini tidak ada）","とうろん　○　討論（とうろん）＝diskusi/debat","ていろん　×　（kata ini tidak ada）","てろん　×　（kata ini tidak ada）"] }
    ]
  },

  /* ===== 問題2 ===== */
  { id: "s2", nav: "問題2 表記", title: "問題2｜表記", type: "choice",
    inst: "＿＿＿の{言葉|ことば}を{漢字|かんじ}で{書|か}くとき、{最|もっと}もよいものを1・2・3・4から{一|ひと}つ{選|えら}びなさい。",
    instTr: "Pilih satu jawaban yang paling tepat saat menulis kata yang bergaris bawah dalam kanji, dari pilihan 1・2・3・4.",
    items: [
      { n: 6, q: "{捕|つか}まえた{金魚|きんぎょ}を{川|かわ}に<u>はなす</u>。",
        tr: "Melepaskan ikan mas yang tertangkap ke sungai.",
        ch: ["防す","改す","放す","訪す"], a: 3,
        ex: "放す（はなす）＝melepaskan" },
      { n: 7, q: "{病気|びょうき}の{人|ひと}を<u>かんご</u>するのが{仕事|しごと}だ。",
        tr: "Pekerjaan saya adalah merawat orang yang sakit.",
        ch: ["看穫","看護","観護","観穫"], a: 2,
        ex: "看護（かんご）＝perawatan (pasien)" },
      { n: 8, q: "{会場|かいじょう}への{入場|にゅうじょう}を<u>せいげん</u>する。",

        ch: ["製限","制郎","制限","製郎"], a: 3,

      { n: 9, q: "{子|こ}どもの{手|て}をしっかりと<u>にぎる</u>。",
        tr: "Menggenggam tangan anak dengan erat.",

        ex: "握る（にぎる）＝menggenggam" },
      { n: 10, q: "{貯金|ちょきん}を{全|すべ}て{病院|びょういん}に<u>きふ</u>した。",
        tr: "Saya menyumbangkan seluruh tabungan kepada rumah sakit.",
        ch: ["奇付","寄付","寄布","奇布"], a: 2,
        ex: "寄付（きふ）＝donasi/sumbangan" }

  },

  /* ===== 問題3 ===== */
  { id: "s3", nav: "問題3 語形成", title: "問題3｜語形成", type: "choice",

    instTr: "Pilih satu jawaban yang paling tepat untuk dimasukkan ke dalam (　　), dari pilihan 1・2・3・4.",
    items: [
      { n: 11, q: "（　　）{企画|きかく}を{提案|ていあん}するための{資料|しりょう}を{作|つく}る。",
        tr: "Membuat materi untuk mengajukan rencana baru.",
        ch: ["好","最","高","新"], a: 4,
        exs: ["好（こう）×　好成績（こうせいせき）＝hasil yang bagus（bukan 好企画）","最（さい）×　最先端（さいせんたん）＝paling mutakhir（bukan 最企画）","高（こう）×　高性能（こうせいのう）＝berkinerja tinggi（bukan 高企画）","新（しん）○　新企画（しんきかく）＝rencana/proyek baru"] },
      { n: 12, q: "{携帯電話|けいたいでんわ}を{落|お}としてしまい、{画面|がめん}の{修理|しゅうり}（　　）に{一万円|いちまんえん}かかった。",
        tr: "Ponsel saya jatuh, dan biaya perbaikan layarnya saja mencapai 10.000 yen.",
        ch: ["費","金","料","賃"], a: 1,
        exs: ["費（ひ）○　修理費（しゅうりひ）＝biaya perbaikan","金（きん）×　保証金（ほしょうきん）＝uang jaminan（bukan 修理金）","料（りょう）×　使用料（しようりょう）＝biaya pemakaian（bukan 修理料）","賃（ちん）×　家賃（やちん）＝sewa rumah（bukan 修理賃）"] },
      { n: 13, q: "{連休|れんきゅう}の{最中|さいちゅう}なので、{映画館|えいがかん}には{親子|おやこ}（　　）が{多|おお}い。",
        tr: "Karena sedang libur panjang, di bioskop banyak orang tua yang datang bersama anaknya.",
        ch: ["{行|い}き","{連|づ}れ","{組|ぐ}み","{巻|ま}き"], a: 2,
        exs: ["行き（ゆき）×　東京行き（とうきょうゆき）＝tujuan Tokyo（bukan 親子行き）","連れ（づれ）○　親子連れ（おやこづれ）＝orang tua bersama anaknya","組み（ぐみ）×　二人組（ふたりぐみ）＝kelompok berdua（bukan 親子組み）","巻き（まき）×　海苔巻き（のりまき）＝gulungan nori（bukan 親子巻き）"] }
    ]
  },

  /* ===== 問題4 ===== */
  { id: "s4", nav: "問題4 文脈規定", title: "問題4｜文脈規定", type: "choice",
    inst: "（　　）に{入|い}れるのに{最|もっと}もよいものを、1・2・3・4から{一|ひと}つ{選|えら}びなさい。",

        tr: "Sejak masuk perusahaan baru saya benar-benar sibuk, tetapi akhirnya bisa meluangkan waktu untuk beristirahat.",
        ch: ["{休息|きゅうそく}","{廃止|はいし}","{休業|きゅうぎょう}","{解消|かいしょう}"], a: 1,
        exs: ["休息（きゅうそく）＝istirahat","廃止（はいし）＝penghapusan/pembatalan","休業（きゅうぎょう）＝libur usaha/tutup sementara","解消（かいしょう）＝penghilangan/penyelesaian"] },
      { n: 16, q: "{弟|おとうと}はお{母|かあ}さんにしかられて{一日中|いちにちじゅう}（　　）していた。",
        tr: "Adik laki-laki dimarahi ibu dan seharian murung/lesu.",

  /* ===== 問題5 ===== */
  { id: "s5", nav: "問題5 言い換え類義", title: "問題5｜言い換え類義", type: "choice",

/* ---------- ここに「言語知識（文法）」「読解」を PARTS.push({...}) で追加します ---------- */

/* =====================================================
   描画
   ===================================================== */
function R(s) {
  return s.replace(/\{([^|}]+)\|([^}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
}
function strip(s) { return s.replace(/<[^>]+>/g, "").replace(/\{([^|}]+)\|([^}]+)\}/g, "$1"); }
function hasRuby(s) { return s.indexOf("{") >= 0; }

function lineBlock(html, id, tr) {
  return '<div class="line-wrap"><div class="line-text">' + html +
    '<div class="sent-id" id="' + id + '">' + tr + '</div></div>' +
    '<div class="btn-group"><button class="btn-r" onclick="toggleRuby(this)">ル</button>' +
    '<button class="btn-s" onclick="toggleSent(\'' + id + '\',this)">訳</button></div></div>';
}

function choicesBlock(ch) {
  var withRuby = ch.some(hasRuby);
  var h = withRuby ? '<button class="btn-r choices-ruby-btn" onclick="toggleChoiceRuby(this)">ル</button>' : '';
  h += '<div class="choices">';
  ch.forEach(function (c, i) { h += '<div class="choice-item">' + (i + 1) + '　' + R(c) + '</div>'; });
  return h + '</div>';
}

function ansBlock(id, mark, inner) {
  return '<button class="ans-btn" onclick="toggleAns(\'' + id + '\')">答えを見る</button>' +
    '<div class="ans-area" id="' + id + '"><span class="correct-mark">' + mark + '</span>' +
    '<div class="sent-id show">' + inner + '</div></div>';
}

function renderChoiceItem(it) {
  var id = "q" + it.n;
  var head = '<div class="mondai-head"><span class="mondai-num">' + it.n + '</span>' + lineBlock(R(it.q), "id-" + id, it.tr) + '</div>';
  var ch = it.ch[it.a - 1];
  var mark = "正答：" + it.a + "　" + strip(ch);
  var inner;
  if (it.exs) {
    inner = it.exs.map(function (e, i) { return (i + 1 === it.a) ? "<b>" + (i + 1) + "　" + e + " ✓</b>" : (i + 1) + "　" + e; }).join("<br>");
  } else {
    inner = "<b>Jawaban: " + it.a + "　" + it.ex + "</b>";
  }
  return '<div class="mondai-card">' + head + '<div class="mondai-body">' + choicesBlock(it.ch) +
    ansBlock("ans-" + id, mark, inner) + '</div></div>';
}

function renderUsageItem(it) {
  var id = "q" + it.n;
  var head = '<div class="mondai-head"><span class="mondai-num">' + it.n + '</span>' +
    '<div class="line-wrap" style="margin:0;"><div class="line-text"><span class="word-head">' + R(it.word) + '</span>' +
    '<div class="sent-id" id="id-' + id + '">' + it.wordTr + '</div></div>' +
    '<div class="btn-group"><button class="btn-r" onclick="toggleRuby(this)">ル</button>' +
    '<button class="btn-s" onclick="toggleSent(\'id-' + id + '\',this)">訳</button></div></div></div>';
  var body = '';
  var inner = [];
  it.s.forEach(function (s, i) {
    body += '<div class="sent-choice">' + lineBlock((i + 1) + "　" + R(s.q), "id-" + id + "-" + (i + 1), s.tr) + '</div>';
    inner.push((i + 1 === it.a ? "<b>" + (i + 1) + "　" + s.ex + "</b>" : (i + 1) + "　" + s.ex));
  });
  return '<div class="mondai-card">' + head + '<div class="mondai-body">' + body +
    ansBlock("ans-" + id, "正答：" + it.a, inner.join("<br>")) + '</div></div>';
}

function renderSection(sec) {
  var h = '<div id="' + sec.id + '" class="section"><div class="section-header">' + sec.title + '</div><div class="section-body">';
  h += '<div class="rei-box"><span class="rei-label">問題文</span>' +
    lineBlock("<b>" + sec.title.split("｜")[0] + "</b>　" + R(sec.inst), "id-" + sec.id + "-inst", sec.instTr) + '</div>';
  var first = sec.items[0].n, last = sec.items[sec.items.length - 1].n;
  h += '<p style="font-size:0.85rem; color:var(--text-light); margin-bottom:8px;">▼ ' + sec.title.split("｜")[0] + '（' + first + '〜' + last + '）</p>';
  sec.items.forEach(function (it) { h += (sec.type === "usage") ? renderUsageItem(it) : renderChoiceItem(it); });
  return h + '</div></div>';
}

(function build() {
  var app = document.getElementById("app");
  var nav = document.getElementById("nav");
  var html = "", navHtml = "";
  PARTS.forEach(function (p) {
    html += '<div class="part-title" id="' + p.id + '">' + p.title + '</div>';
    p.sections.forEach(function (s) {
      html += renderSection(s);
      navHtml += '<a href="#' + s.id + '">' + s.nav + '</a>';
    });
  });
  app.innerHTML = html;
  nav.innerHTML = navHtml;
  var header = document.querySelector("header");
  if (header) nav.style.top = header.offsetHeight + "px";
})();

/* =====================================================
   ボタン動作（サンプルと同じ）
   ===================================================== */
function toggleChoiceRuby(btn) {
  var choices = btn.nextElementSibling;
  if (!choices || !choices.classList.contains("choices")) return;
  var rubies = choices.querySelectorAll("ruby");
  if (rubies.length === 0) return;
  var anyShown = Array.from(rubies).some(function (r) { return r.classList.contains("show"); });
  rubies.forEach(function (r) { r.classList.toggle("show", !anyShown); });
  btn.classList.toggle("active", !anyShown);
}
function toggleRuby(btn) {
  var lineWrap = btn.closest(".line-wrap");
  if (!lineWrap) return;
  var rubies = lineWrap.querySelectorAll("ruby");
  if (rubies.length === 0) return;
  var anyShown = Array.from(rubies).some(function (r) { return r.classList.contains("show"); });
  rubies.forEach(function (r) { r.classList.toggle("show", !anyShown); });
}
function toggleSent(id, btn) {
  var el = document.getElementById(id);
  if (el) el.classList.toggle("show");
}
function toggleAns(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("show");
  var btn = el.previousElementSibling;
  if (btn && btn.classList.contains("ans-btn")) {
    btn.textContent = el.classList.contains("show") ? "答えを隠す" : "答えを見る";
  }
}
</script>
